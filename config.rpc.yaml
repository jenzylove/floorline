# Local test only: same as config.yaml but syncs over the public Monad RPC (HyperSync is not reachable from the dev sandbox).
# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Floorline on Monad mainnet: vault activity, vol updates (CRE), and the Perpl hedge account's fills.
name: floorline
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: FloorVault
    handler: src/EventHandlers.ts
    events:
      - event: "Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)"
      - event: "Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets, uint256 shares)"
      - event: "SeriesCreated(uint256 indexed seriesId, uint256 indexed marketId, uint256 strike, uint64 expiry, address token)"
      - event: "Bought(uint256 indexed seriesId, address indexed buyer, address indexed receiver, uint256 amount, uint256 premium, uint256 collateral)"
      - event: "Settled(uint256 indexed seriesId, uint256 price, uint256 priceTime, uint256 payoutPerToken, uint256 owed, uint256 released)"
      - event: "Redeemed(uint256 indexed seriesId, address indexed holder, address indexed receiver, uint256 amount, uint256 paid)"
  - name: VolFeed
    handler: src/EventHandlers.ts
    events:
      - event: "VolUpdated(uint256 indexed marketId, uint256 vol, uint256 updatedAt, bytes32 source)"
  - name: Perpl
    handler: src/EventHandlers.ts
    events:
      - event: "PositionOpenedV2(uint256 perpId, uint256 accountId, uint8 positionType, uint256 leverageHdths, uint256 depositCNS, int256 pnlCollateralizedCNS, uint256 pricePNS, uint256 lotLNS, uint256 insFeeCNS, uint256 protFeeCNS, uint256 priceResiduePNSQ16)"
      - event: "PositionIncreasedV2(uint256 perpId, uint256 accountId, uint8 positionType, uint256 leverageHdths, uint256 startDepositCNS, uint256 endDepositCNS, int256 pnlCollateralizedCNS, int256 premiumPnlSettledCNS, uint256 maxNegPnlCollatBPS, uint256 pricePNS, uint256 startLotLNS, uint256 endLotLNS, uint256 insFeeCNS, uint256 protFeeCNS, uint256 priceResiduePNSQ16)"
      - event: "PositionDecreased(uint256 perpId, uint256 accountId, uint8 positionType, uint256 startDepositCNS, uint256 endDepositCNS, uint256 startLotLNS, uint256 endLotLNS, int256 deltaPnlCNS, int256 fundingCNS)"
      - event: "PositionClosed(uint256 perpId, uint256 accountId, uint8 positionType, uint256 pricePNS, int256 deltaPnlCNS, int256 fundingCNS)"
chains:
  - id: 143 # Monad mainnet
    rpc:
      - url: https://rpc.monad.xyz
        for: sync
    start_block: 109621700 # just before the vault deploy
    contracts:
      - name: FloorVault
        address: "0x85c57FEc4c4861B7D3a99D47C5189de62221a748"
      - name: VolFeed
        address: "0x57762E9b87b7BB091C1696bc8F55C88694913473"
      - name: Perpl
        address: "0x34B6552d57a35a1D042CcAe1951BD1C370112a6F"
